# One-shot migration Job — app replicas must start only after this Job succeeds.
apiVersion: batch/v1
kind: Job
metadata:
  name: pm-tool-migrate
  namespace: inhouse
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: pm-tool:latest
          command: ["npx", "tsx", "scripts/migrate.ts"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: app-env
                  key: DATABASE_URL
