<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Gambaru PM Tool – Feature Mindmap</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #EEF2FF;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
    gap: 16px;
  }
  .controls {
    display: flex;
    gap: 12px;
    align-items: center;
    background: white;
    padding: 12px 20px;
    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }
  .btn {
    background: #4F46E5;
    color: white;
    border: none;
    padding: 10px 22px;
    border-radius: 8px;
    font-size: 15px;
    font-family: inherit;
    cursor: pointer;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: background 0.2s;
  }
  .btn:hover { background: #4338CA; }
  .hint { color: #6B7280; font-size: 13px; }
  #mm-wrap {
    background: white;
    border-radius: 16px;
    box-shadow: 0 8px 32px rgba(79,70,229,0.15);
    overflow: hidden;
    max-width: 100%;
  }
  svg { display: block; }
  @media print {
    body { background: white; padding: 0; min-height: unset; gap: 0; }
    .controls { display: none; }
    #mm-wrap { box-shadow: none; border-radius: 0; }
    @page { size: A3 landscape; margin: 6mm; }
    svg { width: 100vw !important; height: auto !important; }
  }
</style>
</head>
<body>

<div class="controls">
  <button class="btn" onclick="window.print()">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="6 9 6 2 18 2 18 9"/>
      <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/>
      <rect x="6" y="14" width="12" height="8"/>
    </svg>
    In / Xuất PDF
  </button>
  <span class="hint">Dialog in → <strong>Save as PDF</strong> · Khổ A3 Landscape</span>
</div>

<div id="mm-wrap">
  <svg id="mm" viewBox="0 0 1820 1300" width="1820" height="1300" xmlns="http://www.w3.org/2000/svg"></svg>
</div>

<script>
/* ── Constants ── */
const W = 1820, H = 1300;
const CX = W / 2;          // 910
const CY = 650;             // visual center (shifted up slightly for title balance)
const SPACING   = 148;      // vertical gap between main branches
const PILL_W    = 220;      // pill width
const PILL_H    = 42;       // pill height
const L_PILL_CX = 432;      // left pill center-x
const R_PILL_CX = W - 432;  // right pill center-x  (= 1388)
const L_DOT_X   = 220;      // dot x for left sub-items
const R_DOT_X   = W - 220;  // dot x for right sub-items (= 1600)
const SUB_SP    = 27;       // vertical spacing between sub-items
const CR        = 75;       // center circle radius

// 6 branches: offsets [-2.5, -1.5, -0.5, +0.5, +1.5, +2.5] × SPACING
const branchYs = [-2.5,-1.5,-0.5,0.5,1.5,2.5].map(o => Math.round(CY + o * SPACING));
// ≈ [280, 428, 576, 724, 872, 1020]

/* ── Branch Data ── */
// Note: & is written as &amp; so it renders correctly via innerHTML
const LEFT = [
  { name: "Portfolio Dashboard",     color: "#4F46E5",
    subs: ["Health Score (RAG)", "KPI Cards", "Activity Flow", "Health Matrix", "Onboarding Wizard"] },
  { name: "Programs &amp; Roadmap",  color: "#0D9488",
    subs: ["Quản lý Programs", "Industry &amp; Contact", "Headcount Quota", "Portfolio Roadmap View", "Projects per Program"] },
  { name: "Quản lý Nguồn lực",       color: "#0891B2",
    subs: ["Members nội bộ", "External Members", "FTE Analytics", "Capacity Planning", "Import / Export Excel"] },
  { name: "Vận hành (Operations)",   color: "#059669",
    subs: ["Danh sách Hệ thống", "Incident Management", "Expense Log", "Monthly Cost Tracking"] },
  { name: "Xác thực &amp; Phân quyền", color: "#B45309",
    subs: ["Login &amp; Session", "Multi-tenant System", "Admin Panel", "Users &amp; Companies", "Demo Requests"] },
  { name: "Tích hợp AI (Claude)",    color: "#6D28D9",
    subs: ["Portfolio Report AI", "Weekly Report AI", "Insights &amp; Khuyến nghị", "Export Word / Email"] }
];

const RIGHT = [
  { name: "Quản lý Dự án",           color: "#B91C1C",
    subs: ["Danh sách Projects", "Tạo Project mới", "Project Detail", "Project Dashboard"] },
  { name: "Timeline &amp; Tiến độ",  color: "#C2410C",
    subs: ["Gantt Chart", "Activities &amp; Phases", "Import Excel / Jira", "Export Excel / Word", "Inline Editing"] },
  { name: "Milestones &amp; Phân tích", color: "#DB2777",
    subs: ["Milestone Tracking", "Epic Summary", "Delay Analysis", "Phase Progress", "Overdue Tracking"] },
  { name: "Rủi ro &amp; Vấn đề",     color: "#9D174D",
    subs: ["Risk Register", "Issue Log", "Mitigation Plan", "Priority &amp; Status"] },
  { name: "Ngân sách &amp; Chi phí", color: "#065F46",
    subs: ["CAPEX / OPEX", "Budget Items", "Approval Workflow", "Cảnh báo vượt NS"] },
  { name: "Tài liệu &amp; Giao tiếp", color: "#92400E",
    subs: ["Charter / SOW / Closure", "Export Word / Excel / PPT", "Communication &amp; Meetings", "Document Templates"] }
];

/* ── SVG String Builder ── */
let s = '';

// Defs
s += `<defs>
  <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="rgba(0,0,0,0.16)"/>
  </filter>
  <filter id="csh" x="-60%" y="-60%" width="220%" height="220%">
    <feDropShadow dx="0" dy="0" stdDeviation="18" flood-color="rgba(99,102,241,0.4)"/>
  </filter>
  <radialGradient id="bg" cx="50%" cy="50%" r="70%">
    <stop offset="0%"   stop-color="#F5F3FF"/>
    <stop offset="100%" stop-color="#E8ECFF"/>
  </radialGradient>
  <linearGradient id="cg" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%"   stop-color="#3730A3"/>
    <stop offset="100%" stop-color="#1E1B4B"/>
  </linearGradient>
</defs>`;

// Background
s += `<rect width="${W}" height="${H}" fill="url(#bg)"/>`;

// Grid
for (let y = 0; y < H; y += 56)
  s += `<line x1="0" y1="${y}" x2="${W}" y2="${y}" stroke="#DDD6FE" stroke-width="0.4" opacity="0.55"/>`;
for (let x = 0; x < W; x += 56)
  s += `<line x1="${x}" y1="0" x2="${x}" y2="${H}" stroke="#DDD6FE" stroke-width="0.4" opacity="0.55"/>`;

// Center axis guides (subtle)
s += `<line x1="${CX}" y1="0" x2="${CX}" y2="${H}" stroke="#C7D2FE" stroke-width="0.8" stroke-dasharray="5,7" opacity="0.45"/>`;
s += `<line x1="0" y1="${CY}" x2="${W}" y2="${CY}" stroke="#C7D2FE" stroke-width="0.8" stroke-dasharray="5,7" opacity="0.45"/>`;

/* ── Draw Branches ── */
function drawBranches(branches, isLeft) {
  branches.forEach((b, i) => {
    const by    = branchYs[i];
    const col   = b.color;
    const pcx   = isLeft ? L_PILL_CX : R_PILL_CX;
    const px    = pcx - PILL_W / 2;   // pill left-x
    const py    = by  - PILL_H / 2;   // pill top-y

    // Pill edges
    const pillInX  = isLeft ? px + PILL_W : px;   // edge facing center
    const pillOutX = isLeft ? px          : px + PILL_W; // edge facing subs

    // Center attachment point
    const cAttX = isLeft ? CX - CR + 2 : CX + CR - 2;

    // Bezier: center-attachment → pill inner edge
    const midX = (cAttX + pillInX) / 2;
    s += `<path d="M${cAttX},${CY} C${midX},${CY} ${midX},${by} ${pillInX},${by}"
            stroke="${col}" stroke-width="2.5" fill="none" opacity="0.6"/>`;

    // Pill glow
    s += `<rect x="${px-3}" y="${py-3}" width="${PILL_W+6}" height="${PILL_H+6}"
            rx="23" ry="23" fill="${col}" opacity="0.1"/>`;
    // Pill body
    s += `<rect x="${px}" y="${py}" width="${PILL_W}" height="${PILL_H}"
            rx="21" ry="21" fill="${col}" filter="url(#sh)"/>`;
    // Pill label
    s += `<text x="${pcx}" y="${by+6}" text-anchor="middle"
            fill="white" font-size="12" font-weight="700"
            font-family="Segoe UI,system-ui,sans-serif">${b.name}</text>`;

    // Index badge
    const bx = isLeft ? px - 19 : px + PILL_W + 19;
    s += `<circle cx="${bx}" cy="${by}" r="12" fill="${col}" opacity="0.16"/>`;
    s += `<text x="${bx}" y="${by+5}" text-anchor="middle"
            fill="${col}" font-size="11" font-weight="700"
            font-family="Segoe UI,system-ui,sans-serif">${i+1}</text>`;

    // Sub-items
    const n  = b.subs.length;
    const th = (n - 1) * SUB_SP;
    const sy0 = by - th / 2;
    const dotX = isLeft ? L_DOT_X : R_DOT_X;

    b.subs.forEach((sub, si) => {
      const subY = sy0 + si * SUB_SP;

      // L-shaped curve: from pill outer edge → bend to subY → horizontal to dot
      s += `<path d="M${pillOutX},${by} Q${pillOutX},${subY} ${dotX},${subY}"
              stroke="${col}" stroke-width="1.3" fill="none" opacity="0.38"/>`;

      // Dot
      s += `<circle cx="${dotX}" cy="${subY}" r="3.5" fill="${col}" opacity="0.85"/>`;

      // Sub text
      const tx = isLeft ? dotX - 7 : dotX + 7;
      const anchor = isLeft ? 'end' : 'start';
      s += `<text x="${tx}" y="${subY+4.5}" text-anchor="${anchor}"
              fill="#1F2937" font-size="11.5"
              font-family="Segoe UI,system-ui,sans-serif">${sub}</text>`;
    });
  });
}

drawBranches(LEFT,  true);
drawBranches(RIGHT, false);

/* ── Center Node ── */
s += `<circle cx="${CX}" cy="${CY}" r="${CR+12}" fill="#4F46E5" opacity="0.08" filter="url(#csh)"/>`;
s += `<circle cx="${CX}" cy="${CY}" r="${CR}"    fill="url(#cg)" filter="url(#sh)"/>`;
s += `<circle cx="${CX}" cy="${CY}" r="${CR}"    fill="none" stroke="#6366F1" stroke-width="2.5"/>`;
s += `<circle cx="${CX}" cy="${CY}" r="${CR-11}" fill="none" stroke="#4F46E5" stroke-width="1" opacity="0.35"/>`;

s += `<text x="${CX}" y="${CY-18}" text-anchor="middle"
        fill="white" font-size="20" font-weight="800"
        font-family="Segoe UI,system-ui,sans-serif">Gambaru</text>`;
s += `<text x="${CX}" y="${CY+4}" text-anchor="middle"
        fill="#A5B4FC" font-size="13" font-weight="600"
        font-family="Segoe UI,system-ui,sans-serif">PM Tool</text>`;
s += `<text x="${CX}" y="${CY+23}" text-anchor="middle"
        fill="#818CF8" font-size="9.5"
        font-family="Segoe UI,system-ui,sans-serif">Feature Map</text>`;

/* ── Title ── */
s += `<text x="${CX}" y="46" text-anchor="middle"
        fill="#1E1B4B" font-size="27" font-weight="800"
        font-family="Segoe UI,system-ui,sans-serif"
        filter="url(#sh)">Gambaru – PM Tool</text>`;
s += `<text x="${CX}" y="70" text-anchor="middle"
        fill="#6366F1" font-size="13.5" letter-spacing="0.8"
        font-family="Segoe UI,system-ui,sans-serif">Bản đồ Tính năng Hệ thống Quản lý Dự án</text>`;
// Separator line under title
s += `<line x1="${CX-160}" y1="82" x2="${CX+160}" y2="82" stroke="#C7D2FE" stroke-width="1"/>`;

/* ── Section Labels ── */
s += `<text x="190" y="${H-26}" text-anchor="middle"
        fill="#9CA3AF" font-size="12" font-style="italic"
        font-family="Segoe UI,system-ui,sans-serif">&#8592; Hạ tầng &amp; Quản trị</text>`;
s += `<text x="${W-190}" y="${H-26}" text-anchor="middle"
        fill="#9CA3AF" font-size="12" font-style="italic"
        font-family="Segoe UI,system-ui,sans-serif">Nghiệp vụ Dự án &#8594;</text>`;

/* ── Legend dots ── */
const allBranches = [...LEFT, ...RIGHT];
const legendY = H - 26;
const legendStartX = CX - 560;
allBranches.forEach((b, i) => {
  const lx = legendStartX + i * 96;
  s += `<circle cx="${lx}" cy="${legendY-1}" r="4" fill="${b.color}"/>`;
  s += `<text x="${lx+8}" y="${legendY+3}" fill="#6B7280" font-size="9.5"
          font-family="Segoe UI,system-ui,sans-serif">${i+1}</text>`;
});

/* ── Footer ── */
const today = new Date().toLocaleDateString('vi-VN', {day:'2-digit', month:'2-digit', year:'numeric'});
s += `<text x="${CX}" y="${H-10}" text-anchor="middle"
        fill="#C4B5FD" font-size="10"
        font-family="Segoe UI,system-ui,sans-serif">${today} · Gambaru PMO v1.0 · 12 tính năng chính</text>`;

document.getElementById('mm').innerHTML = s;
</script>
</body>
</html>
